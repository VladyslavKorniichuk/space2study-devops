name: Space2study CI/CD & Artifact Management & DevSecOps

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # =============================================================
  # Backend
  # =============================================================
  backend-check:
    name: Test & Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend dependencies
        run: |
          cd backend
          npm pkg delete scripts.prepare || true
          npm ci --legacy-peer-deps

  # =============================================================
  # Frontend
  # =============================================================
  frontend-check:
    name: Build & Verify frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js 
        uses: actions/setup-node@v7
        with: 
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies & Build
        run: |
          cd frontend
          npm pkg delete scripts.prepare || true
          npm ci --legacy-peer-deps
          npm run build 

  # =============================================================
  # DevSecOps: SCA (Software Composition Analysis)
  # =============================================================
  dependency-security-sca:
    name: Trivy SCA dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Run Trivy SCA on Backend
        uses: aquasecurity/trivy-action@0.28.0
        with: 
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy SCA on Frontend
        uses: aquasecurity/trivy-action@0.28.0
        with: 
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'        

  # =============================================================
  # CD, Container Scanning & Push Docker Images
  # =============================================================
  build-and-push-artifacts:
    name: Build, Scan & Publish Container artifacts
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check, dependency-security-sca]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Docker 
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build Backend Image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: local-backend:test

      - name: Build Frontend Image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: local-frontend:test

      - name: Run Trivy Vulnerability Scan on Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'local-backend:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy Vulnerability Scan on Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'local-frontend:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with: 
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with: 
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          