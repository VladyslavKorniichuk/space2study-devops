version: '3.8'

services:
  # -------------------------------------------------------------
  # MongoDB
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: space2study-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Node.js API (Backend1)
  # -------------------------------------------------------------
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend-1
    restart: unless-stopped
    environment:
      - PORT=5000
      - SERVER_PORT=5000
      - MONGODB_URL=mongodb://mongodb:27017/space2study
      - CLIENT_URL=http://localhost
      - JWT_SECRET=supersecretkey12345
      - SUPER_ADMIN_PASSWORD=Password123!
    depends_on:
      - mongodb
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Node.js API (Backend2)
  # -------------------------------------------------------------
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend-2
    restart: unless-stopped
    environment:
      - PORT=5000
      - SERVER_PORT=5000
      - MONGODB_URL=mongodb://mongodb:27017/space2study
      - CLIENT_URL=http://localhost
      - JWT_SECRET=supersecretkey12345
      - SUPER_ADMIN_PASSWORD=Password123!
    depends_on:
      - mongodb
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Nginx + React SPA (Frontend)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: space2study-frontend
    restart: unless-stopped
    depends_on:
      - backend1
      - backend2
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Load balancer
  # -------------------------------------------------------------
  loadbalancer:
    image: nginx:alpine
    container_name: space2study-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-lb:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend1
      - backend2
    networks:
      - space2study-net

# -------------------------------------------------------------
# Volumes & Networks
# -------------------------------------------------------------
volumes:
  mongo_data: 

networks:
  space2study-net:
    driver: bridge
