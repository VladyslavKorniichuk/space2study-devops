x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------
  # MongoDB
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: space2study-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - space2study-net
    logging: *default-logging

  # -------------------------------------------------------------
  # Node.js API (Backend1)
  # -------------------------------------------------------------
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend-1
    restart: unless-stopped
    environment:
      - PORT=${BACKEND_PORT:-5000}
      - SERVER_PORT=${BACKEND_PORT:-5000}
      - MONGODB_URL=mongodb://mongodb:27017/space2study
      - CLIENT_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      - mongodb
    networks:
      - space2study-net
    logging: *default-logging

  # -------------------------------------------------------------
  # Node.js API (Backend2)
  # -------------------------------------------------------------
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend-2
    restart: unless-stopped
    environment:
      - PORT=${BACKEND_PORT:-5000}
      - SERVER_PORT=${BACKEND_PORT:-5000}
      - MONGODB_URL=mongodb://mongodb:27017/space2study
      - CLIENT_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      - mongodb
    networks:
      - space2study-net
    logging: *default-logging

  # -------------------------------------------------------------
  # Nginx + React SPA (Frontend)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: space2study-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    depends_on:
      - backend1
      - backend2
    networks:
      - space2study-net
    logging: *default-logging

  # -------------------------------------------------------------
  # Load balancer
  # -------------------------------------------------------------
  loadbalancer:
    image: nginx:alpine
    container_name: space2study-lb
    restart: unless-stopped
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    volumes:
      - ./nginx-lb:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend1
      - backend2
    networks:
      - space2study-net
    logging: *default-logging

  # -------------------------------------------------------------
  # cAdvisor
  # -------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: space2study-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: space2study-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: space2study-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # OpenTelemetry Collector
  # -------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: space2study-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "13133:13133" # Health check endpoint
    depends_on:
      - cadvisor
    networks:
      - space2study-net

# -------------------------------------------------------------
# Volumes & Networks
# -------------------------------------------------------------
volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  space2study-net:
    driver: bridge