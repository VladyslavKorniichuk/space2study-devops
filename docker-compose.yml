version: '3.8'

services:
  # -------------------------------------------------------------
  # MongoDB
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: space2study-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Node.js API (Backend)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SERVER_PORT=5000
      - MONGODB_URL=mongodb://mongodb:27017/space2study
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=supersecretkey12345
      - SUPER_ADMIN_PASSWORD=Password123!
    depends_on:
      - mongodb
    networks:
      - space2study-net

  # -------------------------------------------------------------
  # Nginx + React SPA (Frontend)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: space2study-frontend
    restart: unless-stopped
    ports:
      - "3000:80" 
    depends_on:
      - backend
    networks:
      - space2study-net

# -------------------------------------------------------------
# Volumes & Networks
# -------------------------------------------------------------
volumes:
  mongo_data: 

networks:
  space2study-net:
    driver: bridge