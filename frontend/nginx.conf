server {
    listen 80;
    server_name = localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        try_files $uri $uri/ /index.html;
    }
    # Static resources
    location ~* \.(js|css|png|jpg|jpeg|ico|svg){
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";

    }
}