apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: space2study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mongodb
          image: mongo:6.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /data/configdb
            - name: mongo-tmp
              mountPath: /tmp

          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: mongo-data
          emptyDir: {}
        - name: mongo-config
          emptyDir: {}
        - name: mongo-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: space2study
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017