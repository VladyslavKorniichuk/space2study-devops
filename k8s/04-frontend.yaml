apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: space2study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: space2study-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: space2study
spec:
  type: LoadBalancer # port 80 to localhost
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80