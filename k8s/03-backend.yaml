apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: space2study
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: space2study-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: space2study-config
            - secretRef:
                name: space2study-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: space2study
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000