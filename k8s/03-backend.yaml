apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: space2study
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # System calls and prohibiting root
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: space2study-backend:v1
          imagePullPolicy: IfNotPresent
          
          # Container-level security (Hardening)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000 
            capabilities:
              drop:
                - ALL # Removing unnecessary Linux system privileges

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: space2study-config
            - secretRef:
                name: space2study-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: space2study
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000